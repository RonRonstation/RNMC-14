# SQUAD PREPARATION
- type: entity
  parent: ColMarTechBase
  id: ColMarTechGuns
  name: ColMarTech automated weapons rack
  description: An automated weapon rack hooked up to a big storage of standard-issue weapons.
  components:
  - type: AccessReader
    access:
    - [ "CMAccessMarinePrep" ]
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/ColMarTech/guns.rsi
  - type: CMAutomatedVendor
    access:
    - "CMAccessMarinePrep"
    hackable: true
    sections:
    - name: Primary firearms
      entries:
      - id: WeaponRifleM4SPR
      - id: WeaponShotgunM42A2
      - id: WeaponSMGM63
      - id: RMCWeaponRifleM54C
        recommended: true
    - name: Primary ammunition
      entries:
      - id: RMCBoxShotgunFlechette
      - id: RMCBoxShotgunBuckshot
      - id: RMCBoxShotgunSlugs
      - id: CMMagazineRifleM4SPR
      - id: CMMagazineSMGM63
      - id: CMMagazineRifleM54C
    - name: Sidearms
      entries:
      - id: RMCWeaponPistolM77Empty
      - id: RMCWeaponRevolverM44Empty
      - id: CMWeaponPistolM1984Empty
      - id: RMCWeaponPistolM13Empty
      - id: RMCWeaponPistolM82FEmpty
    - name: Sidearm ammunition
      entries:
      - id: CMMagazinePistolM77AP
      - id: RMCSpeedLoaderM44
      - id: CMMagazinePistolM1984
      - id: RMCMagazinePistolM13
    - name: Attachments
      entries:
      - id: RMCAttachmentM63StockCollapsible
      - id: RMCAttachmentM54CStockCollapsible
      - id: RMCAttachmentRailFlashlight
        recommended: true
      - id: RMCAttachmentFlashlightGrip
        recommended: true
      - id: RMCAttachmentU1GrenadeLauncher
    - name: Utilities
      entries:
      - id: RMCM5Bayonet
      - id: CMPackFlare
        recommended: true
    - name: Magazine Boxes
      hasBoxes: true
      jobs:
      - CMQuartermaster
      - CMCargoTech
      entries:
      - id: RMCBoxShellsFlechette
        box: RMCBoxShotgunFlechette
        boxAmount: 4
      - id: RMCBoxShellsBuckshot
        box: RMCBoxShotgunBuckshot
        boxAmount: 4
      - id: RMCBoxShellsSlugs
        box: RMCBoxShotgunSlugs
        boxAmount: 4
      - id: RMCBoxMagazineRifleM4SPR
        box: CMMagazineRifleM4SPR
      - id: RMCBoxMagazineSMGM63
        box: CMMagazineSMGM63
      - id: RMCBoxMagazineRifleM54C
        box: CMMagazineRifleM54C
      - id: RMCBoxMagazinePistolM77AP
        box: CMMagazinePistolM77AP
      - id: RMCBoxMagazineRevolverM44
        box: RMCSpeedLoaderM44
      - id: RMCBoxMagazinePistolM1984
        box: CMMagazinePistolM1984
      - id: RMCBoxMagazinePistolM13
        box: RMCMagazinePistolM13
    - name: Ammunition Boxes
      hasBoxes: true
      jobs:
      - CMQuartermaster
      - CMCargoTech
      entries:
      - id: RMCBoxBulletsRifle
        name: rifle ammunition box (10x24mm) (M4SPR)
        box: CMMagazineRifleM4SPR
        boxSlots: 24 # 600 / 25
      - id: RMCBoxBulletsSMG
        name: SMG HV ammunition box (10x20mm) (M63)
        box: CMMagazineSMGM63
        boxSlots: 13 # 600 / 48, yes we lose half a mag to the void
      - id: RMCBoxBulletsRifle
        name: rifle ammunition box (10x24mm) (M54C)
        box: CMMagazineRifleM54C
        boxSlots: 15 # 600 / 40
    - name: Other Boxes
      hasBoxes: true
      jobs:
      - CMQuartermaster
      - CMCargoTech
      entries:
      - id: RMCBoxPackFlare
        box: CMPackFlare


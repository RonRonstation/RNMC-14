    action: ActionToggleAvaliWagging
  - type: Speech
    speechVerb: Parrot # Didn't come with one
    speechSounds: MaleAvali
    allowedEmotes: [ 'RMCAvaliChirp' ]
  - type: DamageVisuals
    damageOverlayGroups:
      Brute:
        sprite: Mobs/Effects/brute_damage.rsi
        color: "#E6C4FF"
      Burn:
        sprite: Mobs/Effects/burn_damage.rsi
  - type: MeleeWeapon
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    animation: WeaponArcClaw
  - type: Inventory
    speciesId: avali
  - type: FixedIdentity
    name: cm-chatsan-replacement-avali
  - type: CMUHumanMedical
  - type: HitLocation
  - type: PainShock
  - type: BodyZoneTargeting
  - type: Body
    prototype: CMUHumanBody
    requiredLegs: 2
  - type: UserInterface
    interfaces:
      enum.VoiceMaskUIKey.Key:
        type: VoiceMaskBoundUserInterface
      enum.HumanoidMarkingModifierKey.Key:
        type: HumanoidMarkingModifierBoundUserInterface
      enum.StrippingUiKey.Key:
        type: StrippableBoundUserInterface
      enum.CMSurgeryUIKey.Key:
        type: CMSurgeryBui
      enum.HolocardChangeUIKey.Key:
        type: HolocardChangeBoundUserInterface
        interactionRange: 0
        requireInputValidation: false
      enum.CMMobStateActionsUI.Key:
        type: CMGhostActionBui
        requireInputValidation: false
      enum.TacticalMapUserUi.Key:
        type: TacticalMapUserBui
      enum.SquadLeaderTrackerUI.Key:
        type: SquadInfoBui
      enum.DialogUiKey.Key:
        type: DialogBui
      enum.ViewIntelObjectivesUI.Key:
        type: ViewIntelObjectivesBui
      enum.BodyPartPickerUIKey.Key:
        type: BodyPartPickerBui
      enum.CMUSurgeryUIKey.Key:
        type: CMUSurgeryBui

- type: entity
  parent: BaseSpeciesDummy
  id: MobAvaliDummy
  categories: [ HideSpawnMenu ]

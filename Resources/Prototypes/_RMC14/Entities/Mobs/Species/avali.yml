    species: Avali
    hideLayersOnEquip:
    - UndergarmentTop
    - HeadTop
    - HeadSide
  - type: Sprite
    drawdepth: Mobs
  - type: Vocal
    sounds:
      Male: RMCMaleAvali
      Unsexed: RMCMaleAvali
      Female: RMCFemaleAvali


- type: job
  parent: CMJobBase
  id: RNMCArmySquadLeader
  name: rnmc-job-name-army-sl
  description: rnmc-ghost-role-information-army-description
  playTimeTracker: RNMCJobArmySL
  ranks:
    RNMCRankSergeantFirstClass: []
  startingGear: RNMCJobArmySL
  icon: RNMCJobIconArmySL
  joinNotifyCrew: false
  supervisors: cm-job-supervisors-sl
  accessGroups:
  - ArmyAccessCommandPVE
  spawnMenuRoleName: Army Squad Leader
  special:
  - !type:AddComponentSpecial
    components:
    - type: Language
      spokenLanguages:
      - English
      understoodLanguages:
      - English
      currentLanguage: English
      defaultLanguage: English
    - type: NpcFactionMember
      factions:
      - UNMC
    - type: Skills
      skills:
        RMCSkillFirearms: 1
        RMCSkillLeadership: 1
        RMCSkillFireman: 1
        RMCSkillEngineer: 1
        RMCSkillConstruction: 1
        RMCSkillEndurance: 2
        RMCSkillVehicles: 1
        RMCSkillJtac: 3
    - type: JobPrefix
      prefix: rnmc-job-prefix-army-sl
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: leader
    - type: AssignSquad
      whitelist:
        tags:
        - RNMCSquadArmy


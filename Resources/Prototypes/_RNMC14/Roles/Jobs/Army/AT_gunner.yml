
- type: job
  parent: CMJobBase
  id: RNMCAntiTankGunner
  name: rnmc-job-name-at-gunner
  description: rnmc-ghost-role-information-army-description
  playTimeTracker: RNMCJobAntiTankGunner
  ranks:
    RNMCRankSpecialist: []
  startingGear: RNMCJobAntiTankGunner
  icon: RNMCJobIconAntiTankGunner
  joinNotifyCrew: false
  supervisors: cm-job-supervisors-sl
  accessGroups:
  - ArmyAccessPVE
  spawnMenuRoleName: Army Anti-Tank Gunner (Needs Loader)
  special:
  - !type:AddComponentSpecial
    components:
    - type: Language
      spokenLanguages:
      - English
      understoodLanguages:
      - English
      currentLanguage: English
      defaultLanguage: English
    - type: NpcFactionMember
      factions:
      - UNMC
    - type: Skills
      skills:
        RMCSkillFirearms: 1
        RMCSkillFireman: 1
        RMCSkillEngineer: 1
        RMCSkillEndurance: 2
        RMCSkillVehicles: 1
    - type: DemoSpecWhitelist
    - type: JobPrefix
      prefix: rnmc-job-prefix-at-gunner
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: private
    - type: AssignSquad
      whitelist:
        tags:
        - RNMCSquadArmy

- type: entity
  id: RMCRandomHumanoidArmyATGunner
  name: US army anti-tank gunner ghost role spawner
  suffix: Spawner, Player
  components:
  - type: Sprite
    sprite: _RMC14/Markers/landmarks.rsi
    state: co_spawn
  - type: RandomHumanoidSpawner
    settings: RMCPMCSniper

- type: randomHumanoidSettings
  parent: RMCEventHumanoid
  id: RNMCArmyATGunner
  components:
  - type: GhostRole
    name: rnmc-job-name-at-gunner
    description: rnmc-ghost-role-information-army-description
    rules: rmc-ghost-role-information-pmc-rules
    reregister: false
    job: RNMCAntiTankGunner
    raffle:
      settings: short

- type: startingGear
  id: RNMCJobAntiTankGunner
  equipment:
    id: RNMCDogtagArmyATGunner

- type: playTimeTracker
  id: RNMCJobAntiTankGunner

- type: jobIcon
  parent: CMJobIconBase
  id: RNMCJobIconAntiTankGunner
  icon:
    sprite: _RNMC14/Interface/cm_job_icons.rsi
    state: AT_gunner

- type: entity
  parent: CMIDCardStandardDogtag
  id: RNMCDogtagArmyATGunner
  name: Army AT Gunner's dogtags
  components:
  - type: PresetIdCard
    job: RNMCAntiTankGunner

- type: entity
  parent: CMSpawnPointJobBase
  id: CMSpawnPointATGunnerArmy
  name: Army AT Gunner Spawn Point
  components:
  - type: SpawnPoint
    job_id: RNMCAntiTankGunner
  - type: Sprite
    state: marine_spawn
    components:
    - type: Language
      spokenLanguages:
      - English
      understoodLanguages:
      - English
      currentLanguage: English
      defaultLanguage: English
    - type: NpcFactionMember
      factions:
      - UNMC
    - type: Skills
      skills:
        RMCSkillFirearms: 1
        RMCSkillLeadership: 1
        RMCSkillFireman: 1
        RMCSkillEngineer: 1
        RMCSkillConstruction: 1
        RMCSkillEndurance: 2
        RMCSkillVehicles: 1
        RMCSkillJtac: 3
    - type: JobPrefix
      prefix: rnmc-job-prefix-army-ftl-lead
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: tl
    - type: AssignSquad
      whitelist:
        tags:
        - RNMCSquadArmy

- type: entity
  id: RMCRandomHumanoidArmyFireteamLead
  name: US army fireteam lead ghost role spawner
  suffix: Spawner, Player
  components:
  - type: Sprite
    sprite: _RMC14/Markers/landmarks.rsi
    state: co_spawn
  - type: RandomHumanoidSpawner
    settings: RNMCArmyFireteamLead

- type: randomHumanoidSettings
  parent: RMCEventHumanoid
  id: RNMCArmyFireteamLead
  components:
  - type: GhostRole
    name: rnmc-job-name-army-ftl-lead
    description: rnmc-ghost-role-information-army-description
    rules: rmc-ghost-role-information-pmc-rules
    reregister: false
    job: RNMCArmyFireteamLead
    raffle:
      settings: short

- type: startingGear
  id: RNMCJobArmyFTLLead
  equipment:
    id: RNMCDogtagArmyFTLLead

- type: playTimeTracker
  id: RNMCJobArmyFireteamLead

- type: jobIcon
  parent: CMJobIconBase
  id: RNMCJobIconArmyFTLLead
  icon:
    sprite: _RNMC14/Interface/cm_job_icons.rsi
    state: armyteamlead

- type: entity
  parent: CMIDCardStandardDogtag
  id: RNMCDogtagArmyFTLLead
  name: Army Fireteam Lead's dogtags
  components:
  - type: PresetIdCard
    job: RNMCArmyFireteamLead

- type: entity
  parent: CMSpawnPointJobBase

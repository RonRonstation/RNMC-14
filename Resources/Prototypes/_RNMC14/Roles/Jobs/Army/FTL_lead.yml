
- type: job
  parent: CMJobBase
  id: RNMCArmyFireteamLead
  name: rnmc-job-name-army-ftl-lead
  description: rnmc-ghost-role-information-army-description
  playTimeTracker: RNMCJobArmyFireteamLead
  ranks:
    RMCRankSergeant: []
  startingGear: RNMCJobArmyFTLLead
  icon: RNMCJobIconArmyFTLLead
  joinNotifyCrew: false
  supervisors: cm-job-supervisors-sl
  accessGroups:
  - ArmyAccessCommandPVE
  spawnMenuRoleName: Army Fireteam Lead
  special:

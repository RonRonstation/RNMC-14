  playTimeTracker: RNMCJobArmyMarksman
  ranks:
    RMCRankPrivateFirstClass: []
  startingGear: RNMCJobArmyMarksman
  icon: RNMCJobIconArmyMarksman
  joinNotifyCrew: false
  supervisors: cm-job-supervisors-sl
  accessGroups:
  - ArmyAccessPVE
  spawnMenuRoleName: Army Designated Marksman
  special:
  - !type:AddComponentSpecial
    components:
    - type: Language
      spokenLanguages:
      - English
      understoodLanguages:
      - English
      currentLanguage: English
      defaultLanguage: English
    - type: NpcFactionMember
      factions:
      - UNMC
    - type: Skills
      skills:
        RMCSkillFirearms: 1
        RMCSkillFireman: 1
        RMCSkillEngineer: 1
        RMCSkillEndurance: 2
        RMCSkillVehicles: 1
    - type: JobPrefix
      prefix: rnmc-job-prefix-army-marksman
    - type: TacticalMapIcon
      icon:
        sprite: /Textures/_RMC14/Interface/map_blips.rsi
        state: spec
    - type: AssignSquad
      whitelist:
        tags:
        - RNMCSquadArmy


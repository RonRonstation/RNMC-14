- type: entity
  parent: RMCWeaponRifleM54C2
  id: RNMCWeaponRifleM41A2
  name: M41A/2 assault rifle MK1
  description: A modified version M41A pulse rifle re-engineered for better weight and handling, and an high degree of accuracy brought about by a precise two-round burst system.
  components:
  - type: Sprite
    sprite: _RNMC14/Objects/Weapons/Guns/Rifles/m54cmk1/m41a2.rsi # RNMC-14 - Resprited.
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-0
      map: [ "enum.GunVisualLayers.Mag" ]
  - type: Clothing
    sprite: _RNMC14/Objects/Weapons/Guns/Rifles/m54cmk1/m41a2.rsi # RNMC-14 - Resprited.
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: Gun
    selectedMode: FullAuto
    shotsPerBurst: 2
    availableModes:
    - SemiAuto
    - Burst
    - FullAuto
    soundGunshot:
      collection: RNMCM41AShoot
  - type: RMCSelectiveFire
    baseFireModes:
    - SemiAuto
    - Burst
    - FullAuto
    recoilUnwielded: 4
    scatterWielded: 2
    scatterUnwielded: 14
    baseFireRate: 4
    burstFireRateMultiplier: 4
    burstScatterMult: 1

  id: RNMCCartridge9mmDuplex

- type: Tag
  id: RNMCMagazineSMGM39Duplex

- type: entity
  parent: CMMagazineRifleBase
  id: RNMCMagazineSMGM39Duplex
  name: "M39 magazine (9mm Duplex)"
  components:
  - type: Tag
    tags:
    - CMMagazineSmg
    - CMMagazineSMGM63
    - RNMCMagazineSMGM39Duplex
  - type: BallisticAmmoProvider
    mayTransfer: True
    whitelist:
      tags:
      - CMCartridge10x20mm
      - RNMCCartridge9mmDuplex
    proto: CMCartridge9mmDuplex
    capacity: 54
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Magazines/m63.rsi
    layers:
    - state: base
      map: [ "enum.GunVisualLayers.Base" ]
    - state: mag-1
      map: [ "enum.GunVisualLayers.Mag" ]
    - state: ammo_band
      color: "#7D199C"
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
    zeroOnlyOnEmpty: true
  - type: Appearance
  - type: RefillableByBulletBox
    bulletType: RMCBoxBulletsSMG

- type: entity
  parent: CMCartridgeSMGBase
  id: CMCartridge9mmDuplex
  name: cartridge (9mm Duplex)
  components:
  - type: Tag
    tags:
    - Cartridge
    - RNMCCartridge9mmDuplex
  - type: CartridgeAmmo
    proto: RNMCBullet9mmDuplex

- type: entity
  parent: RMCBaseBullet
  id: RNMCBullet9mmDuplex
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 34
  - type: RMCProjectileDamageFalloff
    thresholds:
    - range: 22
      falloff: 9999
      ignoreModifiers: true
    - range: 4
      falloff: 6
  - type: CMArmorPiercing
    amount: 20
  - type: RMCProjectileAccuracy
    accuracy: 100
    thresholds:
    - range: 4
      falloff: 10
  - type: ProjectileSpread
    proto: RNMCBullet9mmDuplex
    count: 2
    spread: 5
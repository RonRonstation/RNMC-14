- type: entity
  parent: CMBaseWeaponRifle
  id: RNMCF99BehemothSniperRifle
  name: F-99 «Behemoth»
  description: A formidable weapon designed for large individuals. Accepts cartridges of the largest and heaviest caliber in order to neutralize them. It is used in situations where you know for sure that the enemy is strong. The reloading of weapons and their rate of fire are extremely slow.
  components:
  - type: Sprite
    sprite: _RNMC14/Objects/Weapons/Guns/Snipers/f99behemoth/f99behemoth_inhands.rsi
    layers:
    - state: base
      sprite: _RNMC14/Objects/Weapons/Guns/Snipers/f99behemoth/f99behemoth_icon.rsi
  - type: Item
    size: Large
  - type: Clothing
    sprite: _RNMC14/Objects/Weapons/Guns/Snipers/f99behemoth/f99behemoth_inhands.rsi
  - type: Tag
    tags:
    - RNMCF99BehemothSniperRifle
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 10
  - type: Gun
    shotsPerBurst: 1
    soundGunshot:
      path: /Audio/_RMC14/Weapons/Guns/Gunshots/gun_sniper_heavy.ogg
  - type: WieldableSpeedModifiers
    base: 0.5
    light: 0.69
    medium: 0.75
    heavy: 0.806
  - type: RMCSelectiveFire
    recoilWielded: 1
    scatterWielded: 0
    baseFireRate: 0.185
  - type: GunDualWielding
    weaponGroup: Rifle
  - type: GunPointBlank
  - type: RMCWeaponAccuracy
    accuracyMultiplier: 2.5
  - type: WieldDelay
    baseDelay: 1
  - type: BallisticAmmoProvider
    capacity: 1
    cycleable: false
    whitelist:
      tags:
      - RNMCBulletBehemoth
      - RNMCBulletBehemothAPHEBC
      - RNMCBulletBehemothSAPCBCI
  - type: GunUserWhitelist
    whitelist:
      components:
      - SniperWhitelist
  - type: AttachableHolder
    slots:
      rmc-aslot-rail:
        whitelist:
          tags:
          - RMCAttachmentHuntingScope
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-rail: 0.0100, 0.100
  - type: GunRequiresWield
  - type: Corrodible
    isCorrodible: false
  - type: RMCNameItemOnVend
    item: PrimaryGun
  - type: RMCFocusedShooting
  - type: UniqueAction
  - type: BreechLoaded
    needOpenClose: true
    openSound:
      path: "/Audio/_RMC14/Weapons/Guns/Breech/pkd_open_chamber.ogg"
    closeSound:
      path: "/Audio/_RMC14/Weapons/Guns/Breech/pkd_close_chamber.ogg"
  - type: WieldedCrosshair
    rsi:
      sprite: _RMC14/Interface/MousePointer/sniper_mouse.rsi
      state: all
  - type: MagazineAmmoProvider
    autoEject: false
    soundAutoEject: null

- type: entity
  parent: RNMCF99BehemothSniperRifle
  id: RNMCF99BehemothSniperRifleFilled
  suffix: Filled
  components:
  - type: BallisticAmmoProvider
    proto: RNMCBulletBehemoth

## Cartridges


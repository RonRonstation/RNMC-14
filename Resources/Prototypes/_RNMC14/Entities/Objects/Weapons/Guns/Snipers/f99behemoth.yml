## Projectiles

#Base Bullet Projectile
- type: entity
  parent: RMCBaseBullet
  id: RNMCBulletSniperBehemoth15,2×76mm
  name: .600 Nitro Express (15,2×76 mm)
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    deleteOnCollide: true
    damage:
      types:
        Piercing: 300
        Structural: 1275
  - type: CMArmorPiercing
    amount: 10
  - type: RMCStunOnHit
    stuns:
    - whitelist:
        minMobSize: SmallXeno
      maxRange: 3.5
      stunTime: 0.75
      slowTime: 1.2
      superSlowTime: 0.6
  - type: RMCPenetratingProjectile
  - type: RMCStoppingPower

#Explosive APHEBC Projectile
- type: entity
  parent: RMCProjectileRocket84mm
  id: RNMCProjectileBehemothAPHEBC
  name: .600 Nitro Express (15,2×76 mm APHEBC)
  categories: [ HideSpawnMenu ]
  components:
  - type: DeleteOnFixedDistanceStop
  - type: TriggerOnCollide
    fixtureID: projectile
    ignoreOtherNonHard: false
  - type: Projectile
    impactEffect: BulletImpactEffect
    damage:
      types:
        Blunt: 25
        Piercing: 15
      maxFixedRange: 0
  - type: TriggerOnFixedDistanceStop
    delay: 0
  - type: DeleteOnTrigger
  - type: SpawnOnTerminate
    spawn: RNMCBehemothEXPImpact
  - type: ProjectileGrenade
    evenSpread: true
    minVelocity: 0.5
    maxVelocity: 1.5
    fillPrototype: RMCShrapnelJagged
    rebounds: true
    capacity: 8
    spreadAngle: 25
  - type: RMCProjectileAccuracy
    accuracy: 110
    thresholds:
    - range: 8
      falloff: 10
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Projectiles/projectiles.rsi
    scale: "1.2, 1.2"
    layers:
    - state: ltb
      shader: unshaded

  #Incendiary SAPCBCI
- type: entity
  parent: RMCBaseBullet
  id: RNMCProjectileBehemothSAPCBCI
  name: .600 Nitro Express (15,2×76 mm SAPCBCI)
  categories: [ HideSpawnMenu ]
  components:
  - type: DeleteOnFixedDistanceStop
  - type: TriggerOnCollide
    fixtureID: projectile
    ignoreOtherNonHard: false
  - type: IgniteOnProjectileHit
  - type: Sprite
    sprite: _RMC14/Objects/Weapons/Guns/Ammunition/Projectiles/firesentry_projectile.rsi
    layers:
    - state: pulse0
      shader: unshaded
  - type: Projectile
    deleteOnCollide: true
    impactEffect: null
    forceSound: true
    damage:
      types:
        Blunt: 15
        Heat: 30
    soundHit: null
  - type: TriggerOnFixedDistanceStop
    delay: 0
  - type: DeleteOnTrigger
  - type: SpawnOnTerminate
    spawn: RNMCBehemothEXPIImpact
    projectileAdjust: false
  - type: IgnoreArc
  - type: IgnorePredictionHide
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.15,-0.45,0.15,0.15"
        hard: false
        mask:
        - Impassable
        - BulletImpassable

## Impacts

# Explosive APHEBC Impact
- type: entity
  id: RNMCBehemothEXPImpact

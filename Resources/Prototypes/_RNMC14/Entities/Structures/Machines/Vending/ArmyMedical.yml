- type: entity
  parent: ColMarTechBaseAnchorable
  id: CMVendorMedicalArmy
  name: Army-Med Plus Plus
  description: Medical pharmaceutical dispenser. Provided by the US Army. Specifically designed to hold way more than the normal version, just for you.
  suffix: Army, no item limits
  components:
  - type: Sprite
    sprite: _RMC14/Structures/Machines/VendingMachines/med.rsi
    layers:
    - state: "off"
    - state: "normal-unshaded"
  - type: CMSolutionRefiller
    randomizeReagentsPlanetside: true
    current: 1200
    max: 1200
    recharge: 125
    rechargeCooldown: 4
    reagents:
    - CMBicaridine
    - CMKelotane
    - CMDylovene
    - CMDexalin
    - CMDexalinPlus
    - CMTricordrazine
    - CMEpinephrine
    - CMInaprovaline
    whitelist:
      components:
      - Hypospray
      - Vial
      tags:
      - Bottle
  - type: CMAutomatedVendor
    hackable: true
    sections:
    - name: Field supplies
      entries:
      - id: CMBurnKit10
      - id: CMTraumaKit10
      - id: CMOintment10
      - id: CMGauze10
    - name: Autoinjectors
      entries:
      - id: CMBicaridineAutoInjector
      - id: CMDexalinPlusAutoInjector
      - id: CMEpinephrineAutoInjector
      - id: CMInaprovalineAutoInjector
      - id: CMKelotaneAutoInjector
      - id: CMTricordrazineAutoInjector
    - name: Liquid bottles
      entries:
      - id: CMBottleBicaridine
      - id: CMBottleDylovene
      - id: CMBottleDexalin
      - id: CMBottleInaprovaline
      - id: CMBottleKelotane
    - name: Pill bottles
      entries:
      - id: CMPillCanisterBicaridine
      - id: CMPillCanisterDexalin
      - id: CMPillCanisterDylovene
      - id: CMPillCanisterInaprovaline
      - id: CMPillCanisterKelotane
    - name: Medical utilities
      entries:
      - id: CMDefibrillator
      - id: CMSurgicalLine
      - id: CMSynthGraft
      - id: CMHyposprayFilledTricord
      - id: CMHealthAnalyzer
      - id: CMBeltMedical
      - id: RMCGlassesMedicalHUDGlasses
      - id: CMStasisBagFolded
      - id: CMSyringe
  - type: AccessReader
    access: [["CMAccessArmyMedical"]]


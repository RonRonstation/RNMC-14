- type: entity
  parent: CMPacketPills
  id: AU14PacketPillsTramadol
  name: tramadol pill packet
  description: This packet contains tramadol pills. Alleviates moderate amounts of pain. Once you take them out, they don't go back in. Don't take more than 1 pill in a short period.
  components:
  - type: Sprite
    state: tramadol_packet
  - type: CMItemSlots
    startingItem: AU14PillCMUTramadol
  - type: IconLabel
    labelTextLocId: rmc-tramadol-container-label-text

- type: entity
  parent: CMPillCanister
  id: AU14PillCanisterTramadol
  name: tramadol pill bottle
  suffix: tramadol, 16
  components:
  - type: Item
    heldPrefix: 11
  - type: Sprite
    layers:
    - state: pill_canister3
      map: [ "bottleSurfaceLayer" ]
    - state: open
      map: [ "openLayer" ]
    - state: closed
      map: [ "closedLayer" ]
  - type: StorageFill
    contents:
    - id: AU14PillCMUTramadol
      amount: 16
  - type: IconLabel
    labelTextLocId: rmc-tramadol-container-label-text

